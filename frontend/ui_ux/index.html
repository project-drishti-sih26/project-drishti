                  <div className="flex items-center justify-between pb-2.5 border-b border-slate-100">
                    <div>
                      <h2 className="text-xs font-bold text-slate-900 uppercase tracking-wider">Case Audit Log</h2>
                      <p className="text-xs text-slate-500">Official log of processed cases and account restriction orders</p>
                    </div>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-50 text-slate-500 font-semibold border-b border-slate-200 uppercase text-[10px] tracking-wider">
                        <tr>
                          <th className="p-3">Case ID</th>
                          <th className="p-3">Victim Account</th>
                          <th className="p-3">Beneficiary Account</th>
                          <th className="p-3">Amount</th>
                          <th className="p-3">ATM Location</th>
                          <th className="p-3">Action Status</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 text-slate-700">
                        <tr>
                          <td className="p-3 font-mono font-bold text-slate-900">NCR-2026-00491</td>
                          <td className="p-3">R. K. Sharma (SBI)</td>
                          <td className="p-3 font-mono">HDFC •••• 9201</td>
                          <td className="p-3 font-bold font-mono">₹85,000</td>
                          <td className="p-3">SBI Kiosk #091, CP</td>
                          <td className="p-3"><span className="px-1.5 py-0.5 bg-rose-100 text-rose-800 border border-rose-300 rounded-sm font-semibold">Active Dispatch</span></td>
                        </tr>
                        <tr>
                          <td className="p-3 font-mono font-bold text-slate-900">NCR-2026-00489</td>
                          <td className="p-3">Amit Verma (PNB)</td>
                          <td className="p-3 font-mono">Kotak •••• 5510</td>
                          <td className="p-3 font-bold font-mono">₹45,000</td>
                          <td className="p-3">ICICI ATM, Janpath</td>
                          <td className="p-3"><span className="px-1.5 py-0.5 bg-slate-100 text-slate-800 border border-slate-300 rounded-sm font-semibold">Case Resolved</span></td>
                        </tr>
                        <tr>
                          <td className="p-3 font-mono font-bold text-slate-900">NCR-2026-00485</td>
                          <td className="p-3">Sunita Patel (BOB)</td>
                          <td className="p-3 font-mono">YESB •••• 7729</td>
                          <td className="p-3 font-bold font-mono">₹2,10,000</td>
                          <td className="p-3">Axis ATM, Shankar Mkt</td>
                          <td className="p-3"><span className="px-1.5 py-0.5 bg-slate-100 text-slate-800 border border-slate-300 rounded-sm font-semibold">Account Restricted</span></td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* 3. POLICE DISPATCH ORDER MODAL */}
          {isDispatchModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-none p-4">
              <div className="bg-white rounded-sm max-w-lg w-full shadow-lg border border-slate-300 overflow-hidden">
                <div className="p-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
                  <div>
                    <h3 className="font-bold text-slate-900 text-sm">Police Dispatch Order</h3>
                    <p className="text-xs text-slate-500">Notice under Section 91 CrPC</p>
                  </div>
                  <button
                    onClick={() => setIsDispatchModalOpen(false)}
                    className="px-2 py-1 text-xs font-mono text-slate-500 hover:text-slate-900 cursor-pointer"
                  >
                    [Close]
                  </button>
                </div>

                <div className="p-4 space-y-3 text-xs">
                  <div className="bg-slate-50 p-3 rounded-sm border border-slate-200 space-y-2">
                    <div className="flex justify-between">
                      <span className="text-slate-500">Case Reference:</span>
                      <span className="font-mono font-bold text-slate-900">{activeCase.case_id}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-500">Reported Loss Amount:</span>
                      <span className="font-mono font-bold text-rose-800">₹{activeCase.compromised_amount.toLocaleString('en-IN')}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-500">Beneficiary Mule Account:</span>
                      <span className="font-mono font-semibold text-slate-800">{activeCase.mule_account} ({activeCase.mule_name})</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-500">Assigned Patrol Unit:</span>
                      <span className="font-semibold text-slate-800">{activeCase.assigned_patrol}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-500">Predicted Withdrawal Location:</span>
                      <span className="font-semibold text-slate-900">{activeCase.predicted_atm}</span>
                    </div>
                  </div>

                  <p className="text-slate-500 text-[11px] leading-relaxed">
                    This official notice directs quick-response field units to verify ongoing cash withdrawals at the identified physical ATM location.
                  </p>
                </div>

                <div className="p-3 bg-slate-50 border-t border-slate-200 flex justify-end gap-2">
                  <button
                    onClick={() => setIsDispatchModalOpen(false)}
                    className="px-3 py-1.5 text-xs font-semibold text-slate-600 hover:bg-slate-200 rounded-sm cursor-pointer"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={generatePDF}
                    className="px-3 py-1.5 text-xs font-semibold bg-slate-900 hover:bg-slate-800 text-white rounded-sm cursor-pointer"
                  >
                    Download PDF Order
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<DrishtiCommandCenter />);
  </script>
</body>
</html>
